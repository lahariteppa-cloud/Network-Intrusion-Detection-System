version: '3.8'

services:
  # Production backend service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://nids_user:nids_password@db:5432/nids
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/dashboard"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Production database service
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=nids
      - POSTGRES_USER=nids_user
      - POSTGRES_PASSWORD=nids_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nids_user -d nids"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Production frontend service (nginx serving static files + proxy to backend)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data: