<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIDS Security Alerts - Threat Intelligence Feed</title>

    <!-- Google Fonts & Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <!-- Immediate Theme Initialization (Prevents FOUC) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('nids_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', savedTheme);
            if (savedTheme === 'dark') document.documentElement.classList.add('dark-theme');
        })();
    </script>
</head>
<body>

    <!-- Unified Header & Navigation Bar -->
    <header>
        <a href="index.html" class="logo">
            <i class="fa-solid fa-shield-halved"></i>
            <span>NIDS</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="alerts.html" class="active">Alerts</a>
            <a href="reports.html">Reports</a>
            <a href="about.html">About</a>
        </nav>

        <div class="nav-actions">
            <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle Dark/Light Mode" title="Toggle Dark/Light Mode">
                <i class="fa-solid fa-moon"></i>
                <span class="theme-toggle-label">Dark</span>
            </button>
            <a href="login.html" class="logout-btn-nav">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </a>
        </div>
    </header>

    <!-- Alerts Container -->
    <main class="page-container">
        <div class="page-header">
            <div class="page-title">
                <h1>Security Incident Alerts</h1>
                <p>Live threat detections and network anomaly notifications</p>
            </div>

            <div class="header-actions">
                <button class="btn secondary" id="clearAlertsBtn">
                    <i class="fa-solid fa-check-double"></i> Acknowledge All
                </button>
            </div>
        </div>

        <!-- Threat Summary Stats -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-icon blue">
                    <i class="fa-solid fa-bell"></i>
                </div>
                <div class="stat-info">
                    <h2 id="totalAlerts">27</h2>
                    <p>Total Alerts</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon red">
                    <i class="fa-solid fa-fire"></i>
                </div>
                <div class="stat-info">
                    <h2 id="highRiskAlerts">12</h2>
                    <p>High Risk</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon purple">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <div class="stat-info">
                    <h2 id="mediumRiskAlerts">8</h2>
                    <p>Medium Risk</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon green">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div class="stat-info">
                    <h2 id="lowRiskAlerts">7</h2>
                    <p>Low Risk</p>
                </div>
            </div>
        </div>

        <!-- Interactive Filter Pills -->
        <div class="alerts-filter-bar">
            <button class="filter-pill active" data-filter="all" id="filterAll">
                All Alerts (27)
            </button>
            <button class="filter-pill" data-filter="high" id="filterHigh">
                High Risk (12)
            </button>
            <button class="filter-pill" data-filter="medium" id="filterMedium">
                Medium Risk (8)
            </button>
            <button class="filter-pill" data-filter="low" id="filterLow">
                Low Risk (7)
            </button>
            <button class="filter-pill" data-filter="info">
                Informational</button>
        </div>

        <!-- Alerts Feed List -->
        <div class="alert-feed" id="alertFeed">    
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 <strong>NIDS</strong> &bull; Network Intrusion Detection System. Automated Threat Classification.</p>
    </footer>

    <!-- Logic Script -->
    <script src="app.js"></script>
</body>
</html>
