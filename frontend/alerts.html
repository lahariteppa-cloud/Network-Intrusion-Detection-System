<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIDS Alerts</title>

    <link rel="stylesheet" href="style..css">
</head>

<body>
    <div class="alerts-page">

    <h1>🚨 Security Alerts</h1>

    <div class="stats">

        <div class="card">
            <h2 id="totalAlerts">0</h2>
            <p>Total Alerts</p>
        </div>

        <div class="card">
            <h2 id="highRisk">0</h2>
            <p>High Risk</p>
        </div>

        <div class="card">
            <h2 id="mediumRisk">0</h2>
            <p>Medium Risk</p>
        </div>

        <div class="card">
            <h2 id="lowRisk">0</h2>
            <p>Low Risk</p>
        </div>

    </div>
    <div id="alertsContainer">
    <p>Loading alerts...</p>
</div>

</div>
    
<script src="script.js"></script>
</body>
</html>
