<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIDS - Register Security Account</title>

    <!-- Google Fonts & Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <!-- Immediate Theme Initialization (Prevents FOUC) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('nids_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', savedTheme);
            if (savedTheme === 'dark') document.documentElement.classList.add('dark-theme');
        })();
    </script>
</head>
<body class="auth-page">

    <!-- Floating Theme Toggle for Auth Pages -->
    <div class="theme-toggle-floating">
        <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle Dark/Light Mode" title="Toggle Dark/Light Mode">
            <i class="fa-solid fa-moon"></i>
            <span class="theme-toggle-label">Dark</span>
        </button>
    </div>

    <div class="auth-card-frame" style="max-width: 480px;">
        <div class="auth-icon-badge">
            <i class="fa-solid fa-user-plus"></i>
        </div>

        <h2>Create Account</h2>
        <p class="auth-sub">Register new security analyst access for NIDS</p>

        <form class="auth-form" id="signupForm">
            <div class="input-field-group">
                <label for="fullName">Full Name</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-id-card"></i>
                    <input type="text" id="fullName" placeholder="Sarah Connor" required>
                </div>
            </div>

            <div class="input-field-group">
                <label for="email">Work Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="sarah@enterprise.com" required>
                </div>
            </div>

            <div class="input-field-group">
                <label for="regUsername">Username</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user-tag"></i>
                    <input type="text" id="regUsername" placeholder="analyst_sarah" required>
                </div>
            </div>

            <div class="input-field-group">
                <label for="regPassword">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="regPassword" placeholder="Create strong password" required minlength="6">
                </div>
            </div>

            <button type="submit" class="auth-action-btn" id="signupSubmitBtn">
                <i class="fa-solid fa-check"></i> Register Account
            </button>

            <div class="auth-footer-links" style="justify-content: center;">
                <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
            </div>
        </form>

        <p class="auth-bottom-text">
            Already have an account? <a href="login.html">Log In</a>
        </p>
    </div>

    <!-- Logic Script -->
    <script src="app.js"></script>
</body>
</html>
