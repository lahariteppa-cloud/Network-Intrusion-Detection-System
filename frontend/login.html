<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIDS - Security Portal Login</title>

    <!-- Google Fonts & Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <!-- Immediate Theme Initialization (Prevents FOUC) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('nids_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', savedTheme);
            if (savedTheme === 'dark') document.documentElement.classList.add('dark-theme');
        })();
    </script>
</head>
<body class="auth-page">

    <!-- Floating Theme Toggle for Auth Pages -->
    <div class="theme-toggle-floating">
        <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle Dark/Light Mode" title="Toggle Dark/Light Mode">
            <i class="fa-solid fa-moon"></i>
            <span class="theme-toggle-label">Dark</span>
        </button>
    </div>

    <div class="auth-card-frame">
        <div class="auth-icon-badge">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <h2>Welcome Back</h2>
        <p class="auth-sub">Enter your security credentials to access NIDS</p>

        <form class="auth-form" id="loginForm">
            <div class="input-field-group">
                <label for="username">Username or Email</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" placeholder="admin@nids.security" required value="admin_secops">
                </div>
            </div>

            <div class="input-field-group">
                <label for="password">Security Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••••••" required value="••••••••••••">
                </div>
            </div>

            <button type="submit" class="auth-action-btn" id="loginSubmitBtn">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
            </button>

            <div class="auth-footer-links">
                <a href="#" onclick="showToast('Password reset link sent to registered email.', 'info'); return false;">Forgot Password?</a>
                <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
            </div>
        </form>

        <p class="auth-bottom-text">
            New to NIDS? <a href="signup.html">Create an Account</a>
        </p>
    </div>

    <!-- Logic Script -->
    <script src="app.js"></script>
</body>
</html>
