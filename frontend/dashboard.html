<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIDS Dashboard</title>

    <link rel="stylesheet" href="style..css">
</head>
<body>
    <div class="dashboard">

    <h1>Network Intrusion Detection Dashboard</h1>

    <div class="stats">

        <div class="card">
            <h2 id="totalTraffic">0</h2>
            <p>Total Network Traffic</p>
        </div>

        <div class="card">
            <h2 id="threatsDetected">0</h2>
            <p>Threats Detected</p>
        </div>

        <div class="card">
            <h2 id="detectionAccuracy">0%</h2>
            <p>Detection Accuracy</p>
        </div>

        <div class="card">
            <h2 id="blockedIPs">0</h2>
            <p>Blocked IPs</p>
        </div>

    </div>

    <div class="charts">

        <div class="chart-box">
            <h3>📈 Network Traffic</h3>
            <p>Chart will appear here</p>
        </div>

        <div class="chart-box">
            <h3>🥧 Attack Distribution</h3>
            <p>Chart will appear here</p>
        </div>

    </div>

    <div class="alerts-section">

    <h2>Recent Alerts</h2>

    <table>
        <thead>
            <tr>
                <th>Time</th>
                <th>Attack Type</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="recentAlerts">
            <tr>
                <td colspan="3">Loading alerts...</td>
            </tr>
        </tbody>
    </table>

</div>

</div>

<script src="script.js"></script>
</body>
</html>
