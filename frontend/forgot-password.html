<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - NIDS</title>

    <link rel="stylesheet" href="style..css">
</head>

<body>

<div class="login-page">

    <div class="login-box">

        <div class="login-icon">
            🔐
        </div>

        <h2>Forgot Password</h2>

        <form id="forgotPasswordForm">

            <div class="input-box">
                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required>
            </div>

            <div class="input-box">
                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required>
            </div>

            <div class="input-box">
                <input
                    type="password"
                    id="newPassword"
                    placeholder="New Password"
                    required>
            </div>

            <div class="input-box">
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required>
            </div>

            <button type="submit">
                Reset Password
            </button>

        </form>

        <p class="signup-link">
            Remember your password?
            <a href="login.html">Login</a>
        </p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
