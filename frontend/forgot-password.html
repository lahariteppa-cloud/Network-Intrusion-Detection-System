<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-base-url" content="https://nids-backend.onrender.com">

    <title>Forgot Password - NIDS</title>

    <!-- Google Fonts & Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <!-- Immediate Theme Initialization (Prevents FOUC) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('nids_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', savedTheme);
            if (savedTheme === 'dark') document.documentElement.classList.add('dark-theme');
        })();
    </script>
</head>

<body class="auth-page">

    <!-- Unified Header & Navigation Bar -->
    <header>
        <a href="index.html" class="logo">
            <i class="fa-solid fa-shield-halved"></i>
            <span>NIDS</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="alerts.html">Alerts</a>
            <a href="reports.html">Reports</a>
            <a href="about.html">About</a>
        </nav>

        <div class="nav-actions">
            <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle Dark/Light Mode" title="Toggle Dark/Light Mode">
                <i class="fa-solid fa-moon"></i>
                <span class="theme-toggle-label">Dark</span>
            </button>
            <a href="login.html" class="login-btn-nav">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Login
            </a>
        </div>
    </header>

    <div class="auth-card-frame">
        <div class="auth-icon-badge">
            <i class="fa-solid fa-lock"></i>
        </div>

        <h2>Forgot Password</h2>
        <p class="auth-sub">Enter your details to reset your password</p>

        <form class="auth-form" id="forgotPasswordForm">
            <div class="input-field-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" placeholder="Enter your username" required>
                </div>
            </div>

            <div class="input-field-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="Enter your registered email" required>
                </div>
            </div>

            <div class="input-field-group">
                <label for="newPassword">New Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="newPassword" placeholder="Create new password" required minlength="6">
                </div>
            </div>

            <div class="input-field-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="6">
                </div>
            </div>

            <button type="submit" class="auth-action-btn" id="resetPasswordBtn">
                <i class="fa-solid fa-key"></i> Reset Password
            </button>

            <div class="auth-footer-links" style="justify-content: center;">
                <a href="login.html"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
            </div>
        </form>

        <p class="auth-bottom-text">
            Remember your password? <a href="login.html">Sign In</a>
        </p>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 <strong>NIDS</strong> &bull; Network Intrusion Detection System. Securing modern networks with AI.</p>
    </footer>

    <!-- Logic Script -->
    <script src="app.js"></script>

</body>
</html>
